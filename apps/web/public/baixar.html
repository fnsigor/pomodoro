<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baixar FocusFlow</title>
<meta name="description" content="Detecta o sistema operacional do visitante e mostra o instalador certo do FocusFlow desktop, buscando sempre a release mais recente do GitHub.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Paleta e tipografia: reaproveitadas do design system do FocusFlow
    (CLAUDE.md do projeto) — violeta único sobre fundo quase preto,
    flat, sem tema claro (o próprio produto é dark-only por decisão).
    Layout: cartão único centralizado — CTA grande pro SO detectado,
    opções alternativas escondidas atrás de um disclosure.
  */
  :root {
    --bg: #0A0A0A;
    --panel: #1A1A1A;
    --panel-sunken: #0D0D0D;
    --border: #282828;
    --border-strong: #363636;
    --ink: #FFFFFF;
    --muted: #9CA3AF;
    --primary: #8B5CF6;
    --primary-hover: #9569F7;
    --primary-tint: #282033;
    --glow: rgba(139, 92, 246, .3);
    --font-display: 'Space Grotesk', Arial, sans-serif;
    --font-body: 'Inter', Arial, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding-block: 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  main {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand .mark {
    width: 40px;
    height: 40px;
    border-radius: 13px;
    background: var(--primary);
    box-shadow: 0 8px 18px var(--glow);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .brand .mark svg { width: 20px; height: 20px; }

  .brand span {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    color: var(--primary);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    text-align: center;
  }

  .card h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.2px;
  }

  .estado {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--muted);
  }

  .estado strong { color: var(--ink); font-weight: 600; }

  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 56px;
    border-radius: 17px;
    background: var(--primary);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 8px 18px var(--glow);
    transition: background-color .15s, transform .15s;
    border: none;
    cursor: pointer;
  }

  .cta:hover { background: var(--primary-hover); }
  @media (prefers-reduced-motion: no-preference) {
    .cta:hover { transform: translateY(-1px); }
  }

  .cta svg { width: 18px; height: 18px; flex-shrink: 0; }

  .meta {
    font-size: 12px;
    color: var(--muted);
  }

  .meta a { color: var(--muted); }

  details {
    text-align: left;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }

  summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  summary::-webkit-details-marker { display: none; }
  summary .chev {
    width: 16px; height: 16px;
    transition: transform .15s;
    flex-shrink: 0;
  }
  details[open] summary .chev { transform: rotate(180deg); }

  .grupo { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
  .grupo h2 {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .lista { display: flex; flex-direction: column; gap: 6px; }

  .opcao {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--panel-sunken);
    border: 1px solid var(--border);
    color: var(--ink);
    text-decoration: none;
    font-size: 13px;
  }
  .opcao:hover { border-color: var(--border-strong); }
  .opcao .nome { font-weight: 500; }
  .opcao .ext {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-tint);
    border-radius: 6px;
    padding: 3px 7px;
    white-space: nowrap;
  }

  .nota {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .nota a { color: var(--primary); }

  .erro {
    font-size: 13px;
    color: var(--muted);
  }
  .erro a { color: var(--primary); }

  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
</style>
</head>
<body>

<main>
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#fff"/>
      </svg>
    </div>
    <span>FocusFlow</span>
  </div>

  <div class="card" id="card">
    <h1>Baixar o app desktop</h1>
    <p class="estado" id="estado">Buscando a versão mais recente…</p>

    <div id="conteudo" hidden></div>
  </div>

  <p class="nota" id="nota-geral" hidden>
    Depois de instalado, o FocusFlow avisa e pergunta antes de aplicar as próximas atualizações.
  </p>
</main>

<script>
(function () {
  var REPO = 'fnsigor/pomodoro';

  var OPCOES = [
    { so: 'windows', rotulo: 'Windows', sufixo: '_x64-setup.exe', detalhe: 'Instalador (.exe)', principal: true },
    { so: 'windows', rotulo: 'Windows', sufixo: '_x64_en-US.msi', detalhe: 'Instalador (.msi)' },
    { so: 'macos', rotulo: 'macOS', sufixo: '.dmg', detalhe: 'Imagem de disco (.dmg)', principal: true },
    { so: 'linux', rotulo: 'Linux', sufixo: '.AppImage', detalhe: 'Roda em qualquer distro, sem instalar', principal: true },
    { so: 'linux', rotulo: 'Linux', sufixo: '.deb', detalhe: 'Pacote Debian / Ubuntu' },
    { so: 'linux', rotulo: 'Linux', sufixo: '.rpm', detalhe: 'Pacote Fedora / RHEL' }
  ];

  var NOMES_SO = { windows: 'Windows', macos: 'macOS', linux: 'Linux' };

  function detectarSO() {
    var ua = navigator.userAgent || '';
    var plat = navigator.platform || '';
    if (/Win/i.test(ua) || /Win/i.test(plat)) return 'windows';
    if (/Mac/i.test(plat) && !/iPhone|iPad|iPod/i.test(ua)) return 'macos';
    if (/Linux/i.test(plat) && !/Android/i.test(ua)) return 'linux';
    return null;
  }

  function iconeDownload() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
  }

  function iconeChevron() {
    return '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function montarOpcoes(assets) {
    return OPCOES.map(function (opcao) {
      var asset = assets.find(function (a) { return a.name.endsWith(opcao.sufixo); });
      if (!asset) return null;
      return Object.assign({}, opcao, { url: asset.browser_download_url, nomeArquivo: asset.name });
    }).filter(Boolean);
  }

  function render(release) {
    var estadoEl = document.getElementById('estado');
    var conteudoEl = document.getElementById('conteudo');
    var notaEl = document.getElementById('nota-geral');

    if (!release) {
      estadoEl.innerHTML = '';
      conteudoEl.hidden = false;
      conteudoEl.innerHTML =
        '<p class="erro">Não consegui buscar a versão mais recente agora. ' +
        '<a href="https://github.com/' + REPO + '/releases/latest" target="_blank" rel="noopener">Veja a página de releases no GitHub</a>.</p>';
      return;
    }

    var disponiveis = montarOpcoes(release.assets || []);
    var soDetectado = detectarSO();
    var principal = disponiveis.find(function (o) { return o.principal && o.so === soDetectado; });
    var outras = disponiveis.filter(function (o) { return o !== principal; });

    var versao = release.tag_name || '';
    var html = '';

    if (principal) {
      estadoEl.innerHTML = 'Detectamos <strong>' + NOMES_SO[soDetectado] + '</strong> — versão <strong>' + escapeHtml(versao) + '</strong>';
      html += '<a class="cta" href="' + principal.url + '" target="_blank" rel="noopener">' + iconeDownload() + '<span>Baixar para ' + NOMES_SO[soDetectado] + '</span></a>';
    } else {
      estadoEl.innerHTML = 'Versão <strong>' + escapeHtml(versao) + '</strong> — escolha seu sistema';
    }

    if (outras.length) {
      var porSistema = {};
      outras.forEach(function (o) {
        (porSistema[o.so] = porSistema[o.so] || []).push(o);
      });

      html += '<details' + (principal ? '' : ' open') + '>';
      html += '<summary><span>' + (principal ? 'Outros sistemas e formatos' : 'Todos os sistemas') + '</span>' + iconeChevron() + '</summary>';
      Object.keys(porSistema).forEach(function (so) {
        html += '<div class="grupo"><h2>' + NOMES_SO[so] + '</h2><div class="lista">';
        porSistema[so].forEach(function (o) {
          html += '<a class="opcao" href="' + o.url + '" target="_blank" rel="noopener">' +
            '<span class="nome">' + escapeHtml(o.detalhe) + '</span>' +
            '<span class="ext">' + escapeHtml(o.sufixo.replace(/^[_.]/, '').split('.').pop().toUpperCase()) + '</span>' +
            '</a>';
        });
        html += '</div></div>';
      });
      html += '</details>';
    }

    html += '<p class="meta"><a href="' + release.html_url + '" target="_blank" rel="noopener">Ver notas da versão e todos os arquivos ↗</a></p>';

    conteudoEl.innerHTML = html;
    conteudoEl.hidden = false;
    notaEl.hidden = false;
  }

  fetch('https://api.github.com/repos/' + REPO + '/releases/latest', { headers: { Accept: 'application/vnd.github+json' } })
    .then(function (r) { if (!r.ok) throw new Error('status ' + r.status); return r.json(); })
    .then(render)
    .catch(function () { render(null); });
})();
</script>
</body>
</html>

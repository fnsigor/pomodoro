name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - name: instalar dependências de sistema (só ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev
      - run: pnpm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'FocusFlow ${{ github.ref_name }}'
          releaseBody: |
            ## Qual arquivo baixar?

            | Sistema | Baixe o arquivo que termina em |
            | --- | --- |
            | Windows | `_x64-setup.exe` (ou `.msi`, equivalente) |
            | macOS | `.dmg` |
            | Linux — a maioria das distros | `.AppImage` (não precisa instalar nada) |
            | Linux — Debian/Ubuntu | `.deb` |
            | Linux — Fedora/RHEL | `.rpm` |

            Os arquivos `.sig` e o `latest.json` abaixo **não são pra baixar** — são usados internamente pelo app pra verificar atualizações automáticas.
